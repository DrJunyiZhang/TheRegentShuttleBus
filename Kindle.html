<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Regent Shuttle Bus Arrival Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #e6ecf3;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: block;
      text-align: center;
    }
    .mtr-screen {
      margin-top: 40px;
      background: #e6ecf3;
      border-radius: 18px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.13);
      padding: 0;
      min-width: 350px;
      max-width: 400px;
      width: 98%;
      overflow: hidden;
      text-align: left;
      margin-left: auto;
      margin-right: auto;
    }

    .header-bar {
      background: #597ab9;
      color: #fff;
      font-size: 1.7em;
      font-weight: bold;

      height: 54px;
      padding: 0 24px;
      letter-spacing: 0.03em;
      line-height: 54px;

      /* FIX for Kindle browser layout issues */
      display: flex;
      align-items: center;
      justify-content: space-between; /* date left, time right */
      gap: 12px;
    }

    #current-date {
      font-size: 0.78em;
      letter-spacing: 0.04em;
    }
    #current-time {
      font-size: 0.78em;
      letter-spacing: 0.04em;
      text-align: right;
      margin-left: auto;
    }

    .arrivals-table {
      width: 100%;
      border-collapse: collapse;
    }
    .arrivals-table tr {
      height: 54px;
      font-size: 1.35em;
      font-weight: 600;
    }
    .arrivals-table tr:nth-child(odd) { background: #f4f7fa; }
    .arrivals-table tr:nth-child(even) { background: #dbe5f2; }
    .arrivals-table td {
      padding: 0 26px;
      vertical-align: middle;
      border: none;
    }
    .bus-name {
      color: #384e6c;
      font-size: 1.15em;
      font-weight: bold;
      text-align: left;
      letter-spacing: 0.04em;
    }
    .wait-mins {
      color: #384e6c;
      font-size: 1.35em;
      font-weight: bold;
      text-align: right;
      letter-spacing: 0.04em;
      min-width: 80px;
    }
    .footer-message {
      background: #f8fafd;
      padding: 16px 20px;
      text-align: center;
      font-size: 0.95em;
      color: #455a7f;
      line-height: 1.5;
      border-top: 2px solid #dbe5f2;
    }

    @media (max-width: 500px) {
      .mtr-screen { min-width: 0; max-width: 98vw; }
      .header-bar {
        font-size: 1.08em;
        height: 38px;
        line-height: 38px;
        padding: 0 12px;

        /* keep the flex behavior */
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .arrivals-table td { padding: 0 12px; }
      .arrivals-table tr { font-size: 1em; height: 38px; }
      .wait-mins { min-width: 56px; font-size: 1em; }
      .bus-name { font-size: 1em; }
      #current-date { font-size: 0.68em; }
      #current-time { font-size: 0.68em; }
    }
  </style>
</head>

      n = String(n);
      return (n.length === 1) ? ("0" + n) : n;

    // HK is UTC+8
    var HK_OFFSET_MINUTES = 8 * 60;

    // Return a Date object representing "Hong Kong local time"
    // by shifting the instant by (localOffset -> UTC -> HK).
    function getHKNow() {
      var now = new Date();
      var utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      var hkMs = utcMs + (HK_OFFSET_MINUTES * 60000);
      return new Date(hkMs);
    }

    function formatCurrentTimeHK() {
      var hk = getHKNow();
      return pad2(hk.getHours()) + ":" + pad2(hk.getMinutes()) + ":" + pad2(hk.getSeconds());
    }

    function formatCurrentDateHK() {
      var hk = getHKNow();
      var year = hk.getFullYear();
      var month = pad2(hk.getMonth() + 1);
      var day = pad2(hk.getDate());
      var weekday = WEEKDAY_SHORT[hk.getDay()];
      return year + "-" + month + "-" + day + " " + weekday;
    }

    function formatWait(diffMs) {
      var diffSec = Math.floor(diffMs / 1000);
      var minutes = Math.floor(diffSec / 60);
      var seconds = diffSec % 60;
      if (seconds < 0) seconds = 0;
      return String(minutes) + "." + pad2(seconds);

    // ── Shuttle helpers (HK forced) ─────────────────────────────────────────
    function getTimetable(bus) {
      var hkNow = getHKNow();
      var day = hkNow.getDay(); // 0=Sun ... 6=Sat
      var isWeekend = (day === 0 || day === 6);

      if (bus === 'A') return isWeekend ? busATimesWeekend : busATimesWeekday;
      if (bus === 'B') return isWeekend ? busBTimesWeekend : busBTimesWeekday;
      if (bus === 'C') return isWeekend ? busCTimesWeekend : busCTimesWeekday;
      return [];
    }

    function getBusDateTimesForDay(busTimes, dayOffset) {
      if (dayOffset === undefined) dayOffset = 0;

      var hkNow = getHKNow();
      var base = new Date(
        hkNow.getFullYear(),
        hkNow.getMonth(),
        hkNow.getDate() + dayOffset,
        0, 0, 0, 0
      );

      var out = [];
      for (var i = 0; i < busTimes.length; i++) {
        var t = busTimes[i];
        out.push(new Date(
          base.getFullYear(),
          base.getMonth(),
          base.getDate(),
          t.hour,
          t.minute,
          0, 0
        ));
      }
      return out;
    }

    function getNextNBuses(bus, n) {
      var hkNow = getHKNow();
      var times = getTimetable(bus);

      var todayTimes = getBusDateTimesForDay(times, 0);
      var todayBuses = [];

      for (var i = 0; i < todayTimes.length; i++) {
        if (todayTimes[i] > hkNow) todayBuses.push(todayTimes[i]);
      }

      var buses = [];
      if (todayBuses.length >= n) {
        for (i = 0; i < n; i++) buses.push(todayBuses[i]);
      } else {
        for (i = 0; i < todayBuses.length; i++) buses.push(todayBuses[i]);

        var tomorrowBuses = getBusDateTimesForDay(times, 1);
        var needed = n - buses.length;

        for (i = 0; i < tomorrowBuses.length && buses.length < n; i++) {
          if (i < needed) buses.push(tomorrowBuses[i]);
        }
      }
      return buses;
    }

    function getNextCombinedArrivals(n) {
      var hkNow = getHKNow();
      var arrivals = [];

      var arrivalsA = getNextNBuses('A', n * 2);
      for (var i = 0; i < arrivalsA.length; i++) arrivals.push({ bus: 'Bus A', time: arrivalsA[i] });

      var arrivalsB = getNextNBuses('B', n * 2);
      for (i = 0; i < arrivalsB.length; i++) arrivals.push({ bus: 'Bus B', time: arrivalsB[i] });

      var arrivalsC = getNextNBuses('C', n * 2);
      for (i = 0; i < arrivalsC.length; i++) arrivals.push({ bus: 'Bus C', time: arrivalsC[i] });

      var filtered = [];
      for (i = 0; i < arrivals.length; i++) {
        if (arrivals[i].time > hkNow) filtered.push(arrivals[i]);
      }

      filtered.sort(function(a, b) {
        return a.time.getTime() - b.time.getTime();
      });

      return filtered.slice(0, n);
    }

    // ── Update Functions ─────────────────────────────────────────────────────
    function updateHeader() {
      document.getElementById('current-date').textContent = formatCurrentDateHK();
      document.getElementById('current-time').textContent = formatCurrentTimeHK();
    }

    function updateArrivalsTable() {
      var table = document.getElementById('arrivals-table');
      var now = getHKNow();
      var nextShuttle = getNextCombinedArrivals(6);

      var html = '';
      for (var i = 0; i < nextShuttle.length; i++) {
        var arrival = nextShuttle[i];
        var diffMs = arrival.time.getTime() - now.getTime();

        var hours = pad2(arrival.time.getHours());
        var minutes = pad2(arrival.time.getMinutes());
        var scheduled = hours + ":" + minutes;

        html += '<tr>';
        html += '  <td class="bus-name">';
        html += '    ' + arrival.bus;
        html += '    <span style="color:#666; font-size:0.82em; margin-left:10px; letter-spacing:0.02em;">' + scheduled + '</span>';
        html += '  </td>';
        html += '  <td class="wait-mins">' + formatWait(diffMs) + '</td>';
        html += '</tr>';
      }

      table.innerHTML = html;
    }

    function updateAll() {
      updateHeader();
      updateArrivalsTable();
    }

    setInterval(updateAll, 1000);
    updateAll();
  </script>
