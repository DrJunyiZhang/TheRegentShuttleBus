      border-radius: 18px;

      padding: 0;
      min-width: 350px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;

      font-size: 1.7em;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 54px;
      padding: 0 24px;
      letter-spacing: 0.03em;

    .arrivals-table {
      width: 100%;
      border-collapse: collapse;
    }
    .arrivals-table tr {
      height: 54px;
      font-size: 1.35em;
      font-weight: 600;
    }
    .arrivals-table tr:nth-child(odd) { background: #f4f7fa; }
    .arrivals-table tr:nth-child(even) { background: #dbe5f2; }
    .arrivals-table td {
      padding: 0 26px;
      vertical-align: middle;
      border: none;
    }
    .bus-name {
      color: #384e6c;
      font-size: 1.15em;
      font-weight: bold;
      text-align: left;
      letter-spacing: 0.04em;

    .wait-mins {

      text-align: right;

    .footer-message {

      padding: 16px 20px;
      text-align: center;
      font-size: 0.95em;
      color: #455a7f;
      line-height: 1.5;
      border-top: 2px solid #dbe5f2;
    }
    @media (max-width: 500px) {

      .arrivals-table tr { font-size: 1em; height: 38px; }
      .wait-mins { min-width: 56px; font-size: 1em; }
      .bus-name { font-size: 1em; }
      #current-date { font-size: 0.68em; }
    }

    // ── Shuttle helpers ─────────────────────────────────────────
    function getTimetable(bus) {
      var now = new Date();
      var day = now.getDay(); // 0=Sun, 6=Sat
      var isWeekend = (day === 0 || day === 6);

      if (bus === 'A') return isWeekend ? busATimesWeekend : busATimesWeekday;
      if (bus === 'B') return isWeekend ? busBTimesWeekend : busBTimesWeekday;
      if (bus === 'C') return isWeekend ? busCTimesWeekend : busCTimesWeekday;
      return [];
    }

    function getBusDateTimesForDay(busTimes, dayOffset) {
      if (dayOffset === undefined) dayOffset = 0;
      var now = new Date();
      var base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);

      var out = [];
      var i;
      for (i = 0; i < busTimes.length; i++) {
        var t = busTimes[i];
        out.push(new Date(base.getFullYear(), base.getMonth(), base.getDate(), t.hour, t.minute, 0, 0));
      }
      return out;
    }

    function getNextNBuses(bus, n) {
      var now = new Date();
      var times = getTimetable(bus);

      var buses = [];
      var todayTimes = getBusDateTimesForDay(times, 0);

      var todayBuses = [];
      var i;
      for (i = 0; i < todayTimes.length; i++) {
        if (todayTimes[i] > now) todayBuses.push(todayTimes[i]);
      }

      if (todayBuses.length >= n) {
        for (i = 0; i < n; i++) buses.push(todayBuses[i]);
      } else {
        for (i = 0; i < todayBuses.length; i++) buses.push(todayBuses[i]);
        var tomorrowBusesAll = getBusDateTimesForDay(times, 1);
        var needed = n - buses.length;

        for (i = 0; i < tomorrowBusesAll.length && buses.length < n; i++) {
          if (i < needed) buses.push(tomorrowBusesAll[i]);
        }
      }
      return buses;
    }

    function formatWait(diffMs) {
      var diffSec = Math.floor(diffMs / 1000);
      var minutes = Math.floor(diffSec / 60);
      var seconds = diffSec % 60;
      return String(minutes) + "." + pad2(seconds);
    }

    function formatCurrentTime(dateObj) {
      return pad2(dateObj.getHours()) + ":" + pad2(dateObj.getMinutes()) + ":" + pad2(dateObj.getSeconds());
    }

    function formatCurrentDate(dateObj) {
      var year = dateObj.getFullYear();
      var month = pad2(dateObj.getMonth() + 1);
      var day = pad2(dateObj.getDate());
      var weekday = dateObj.toLocaleString('en-US', { weekday: 'short' });
      return year + "-" + month + "-" + day + " " + weekday;
    }

    function getNextCombinedArrivals(n) {
      var now = new Date();
      var i;

      var arrivals = [];

      var arrivalsA = getNextNBuses('A', n * 2);
      for (i = 0; i < arrivalsA.length; i++) arrivals.push({ bus: 'Bus A', time: arrivalsA[i] });

      var arrivalsB = getNextNBuses('B', n * 2);
      for (i = 0; i < arrivalsB.length; i++) arrivals.push({ bus: 'Bus B', time: arrivalsB[i] });

      var arrivalsC = getNextNBuses('C', n * 2);
      for (i = 0; i < arrivalsC.length; i++) arrivals.push({ bus: 'Bus C', time: arrivalsC[i] });

      // filter & sort
      var filtered = [];
      for (i = 0; i < arrivals.length; i++) {
        if (arrivals[i].time > now) filtered.push(arrivals[i]);
      }

      filtered.sort(function(a, b) { return a.time - b.time; });

      return filtered.slice(0, n);
    }

        html += '  <td class="wait-mins">' + formatWait(diffMs) + '</td>';
        html += '</tr>';
      }

      table.innerHTML = html;
    }
