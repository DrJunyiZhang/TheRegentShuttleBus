    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700&display=swap');
    body {
      background: #e6ecf3;

      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .mtr-screen {
      margin-top: 40px;
      background: #e6ecf3;
      border-radius: 18px;
      box-shadow: 0 6px 28px #0002;
      padding: 0;
      min-width: 350px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;
    }
    .header-bar {
      background: #597ab9;
      color: #fff;

      font-weight: bold;

      height: 54px;
      font-size: 1.35em;
      font-weight: 600;
    }
    .arrivals-table tr:nth-child(odd) { background: #f4f7fa; }
    .arrivals-table tr:nth-child(even) { background: #dbe5f2; }
    .arrivals-table td {
      padding: 0 26px;
      vertical-align: middle;
      border: none;
    }
    .bus-name {
      color: #384e6c;
      font-size: 1.15em;
      font-weight: bold;
      text-align: left;
      letter-spacing: 0.04em;
    }
    .wait-mins {
      color: #384e6c;
      font-size: 1.35em;
      font-weight: bold;
      text-align: right;
      letter-spacing: 0.04em;
      min-width: 80px;
    }
    .remark {
      font-size: 0.70em;
      color: #666;
      display: block;
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
    @media (max-width: 500px) {
      .mtr-screen { min-width: 0; max-width: 98vw; }
      .header-bar { font-size: 1.08em; height: 38px; padding: 0 12px; }

      .wait-mins { min-width: 56px; font-size: 1em; }

    const KMB_SERVICE_TYPES = ["1", "2"];

    let kmbCache = [];

    async function fetchKMBETAs() {
      let etas = [];
      const now = new Date();

      for (const st of KMB_SERVICE_TYPES) {
        try {
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${KMB_STOP_ID}/${KMB_ROUTE}/${st}`;
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          if (json.data && json.data.length > 0) {
            // STRICT FILTER: only scheduled departures (seq === 1) and future
            const departures = json.data
              .filter(e => e.eta && new Date(e.eta) > now && e.seq === 1)
              .sort((a, b) => new Date(a.eta) - new Date(b.eta));
            etas = etas.concat(departures);
          }
        } catch (err) {
          console.warn("KMB ETA fetch error for type", st, err);
        }
      }
      
	// Dedupe by eta timestamp & sort (latest first 3)

        .filter((e, i, self) => self.findIndex(t => t.eta === e.eta) === i)
        .sort((a, b) => new Date(a.eta) - new Date(b.eta))
        .slice(0, 3);

      kmbCache = etas;
    }

    function formatKMBDiff(etaStr) {
      if (!etaStr) return "--.--";
      const etaDate = new Date(etaStr);
      const diffMs = etaDate - new Date();
      if (diffMs < 0) return "Departed";
      const minutes = Math.floor(diffMs / 60000);
      const seconds = Math.floor((diffMs % 60000) / 1000);
      return `${minutes}.${seconds.toString().padStart(2, '0')}`;
    }
    
    // ── Your original helpers (slightly adjusted) ───────────────────────────────
    function getTimetable(bus) {
      const now = new Date();
      const isWeekend = now.getDay() === 0 || now.getDay() === 6;
      if (bus === 'A') return isWeekend ? busATimesWeekend : busATimesWeekday;
      if (bus === 'B') return isWeekend ? busBTimesWeekend : busBTimesWeekday;
      if (bus === 'C') return isWeekend ? busCTimesWeekend : busCTimesWeekday;
      return [];
    }

    function getBusDateTimesForDay(busTimes, dayOffset = 0) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      return busTimes.map(t => new Date(date.getFullYear(), date.getMonth(), date.getDate(), t.hour, t.minute, 0, 0));
    }

    function getNextNBuses(bus, n) {
      const now = new Date();
      const times = getTimetable(bus);
      let buses = [];
      let todayBuses = getBusDateTimesForDay(times, 0).filter(t => t > now);
      if (todayBuses.length >= n) {
        buses = todayBuses.slice(0, n);
      } else {
        buses = todayBuses;
        const tomorrowBuses = getBusDateTimesForDay(times, 1);
        const needed = n - buses.length;
        buses = buses.concat(tomorrowBuses.slice(0, needed));
      }
      return buses;
    }

    function formatWait(diffMs) {
      const diffSec = Math.floor(diffMs / 1000);
      const minutes = Math.floor(diffSec / 60);
      const seconds = diffSec % 60;
      return `${minutes}.${seconds.toString().padStart(2,'0')}`;
    }

    function formatCurrentTime(dateObj) {
      return dateObj.getHours().toString().padStart(2, '0') + ':' +
             dateObj.getMinutes().toString().padStart(2, '0') + ':' +
             dateObj.getSeconds().toString().padStart(2, '0');
    }

    function formatCurrentDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
      const day = dateObj.getDate().toString().padStart(2, '0');
      const weekday = dateObj.toLocaleString('en-US', { weekday: 'short' });
      return `${year}-${month}-${day} ${weekday}`;
    }

    function getNextCombinedArrivals(n) {
      const now = new Date();
      const arrivalsA = getNextNBuses('A', n*2).map(dt => ({ bus: 'Bus A', time: dt }));
      const arrivalsB = getNextNBuses('B', n*2).map(dt => ({ bus: 'Bus B', time: dt }));
      const arrivalsC = getNextNBuses('C', n*2).map(dt => ({ bus: 'Bus C', time: dt }));
      const allArrivals = arrivalsA.concat(arrivalsB, arrivalsC)
        .filter(obj => obj.time > now)
        .sort((a, b) => a.time - b.time);
      return allArrivals.slice(0, n);
    }

    // ── Update Functions ───────────────────────────────────────────────────────
    function updateHeader() {
      const now = new Date();
      document.getElementById('current-date').textContent = formatCurrentDate(now);
      document.getElementById('current-time').textContent = formatCurrentTime(now);
    }

    async function updateArrivalsTable() {
      const table = document.getElementById('arrivals-table');
      const now = new Date();
      const nextShuttle = getNextCombinedArrivals(4);

      let html = '';

      // Shuttle buses A/B/C (unchanged)
      nextShuttle.forEach(arrival => {
        const diffMs = arrival.time - now;
        const hours = arrival.time.getHours().toString().padStart(2, '0');
        const minutes = arrival.time.getMinutes().toString().padStart(2, '0');
        const scheduled = `${hours}:${minutes}`;
        html += `
          <tr>
            <td class="bus-name">
              ${arrival.bus}
              <span style="color:#666; font-size:0.82em; margin-left:10px; letter-spacing:0.02em;">${scheduled}</span>
            </td>
            <td class="wait-mins">${formatWait(diffMs)}</td>
          </tr>
        `;
      });

      // 74K real-time ── now up to 3 buses
      if (eduhkCache.length > 0) {
        eduhkCache.forEach(eta => {
          const etaDate = new Date(eta.eta);
          const hours = etaDate.getHours().toString().padStart(2, '0');
          const minutes = etaDate.getMinutes().toString().padStart(2, '0');
          const scheduled = `${hours}:${minutes}`;
          const remark = eta.rmk_en ? `(${eta.rmk_en})` : '';
          html += `
            <tr>
              <td class="bus-name">
                74K at EdUHK (TP893)
                <span style="color:#666; font-size:0.82em; margin-left:10px; letter-spacing:0.02em;">${scheduled}</span>
                <span class="remark">arrival at campus ${remark}</span>
              </td>
              <td class="wait-mins">${formatKMBDiff(eta.eta)}</td>
            </tr>
          `;
        });
      } else {
        html += `
          <tr>
            <td class="bus-name">
              74K at EdUHK (TP893)
              <span class="remark">arrival at campus • loading...</span>
            </td>
            <td class="wait-mins">--.--</td>
          </tr>
        `;
      }
      
      if (eduhkCache.length > 0) {
        eduhkCache.forEach(eta => {
          const etaDate = new Date(eta.eta);
          const hours = etaDate.getHours().toString().padStart(2, '0');
          const minutes = etaDate.getMinutes().toString().padStart(2, '0');
          const scheduled = `${hours}:${minutes}`;
          const remark = eta.rmk_en ? `(${eta.rmk_en})` : '';
          html += `
            <tr>
              <td class="bus-name">
                74K at EdUHK
                <span style="color:#666; font-size:0.82em; margin-left:10px; letter-spacing:0.02em;">${scheduled}</span>
                <span class="remark">arrival at campus ${remark}</span>
              </td>
              <td class="wait-mins">${formatKMBDiff(eta.eta)}</td>
            </tr>
          `;
        });
      } else {
        html += `
          <tr>
            <td class="bus-name">
              74K at EdUHK
              <span class="remark">arrival at campus • loading...</span>
            </td>
            <td class="wait-mins">--.--</td>
          </tr>
        `;
      }

      table.innerHTML = html;
    }

    async function updateAll() {
      updateHeader();
      await updateArrivalsTable();
    }

    // ── Start ──────────────────────────────────────────────────────────────────
    fetchKMBETAs();       // Tai Po Market
    fetchEdUHKETAs();     // EdUHK TP893
    setInterval(fetchKMBETAs, 30000);
    setInterval(fetchEdUHKETAs, 30000);
    setInterval(updateAll, 1000);     // update clock & display every 1s
    updateAll();                      // initial call
  </script>
</body>
</html>
