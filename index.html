<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Regent Shuttle Bus Arrival Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@700&display=swap');
    body {
      background: #e6ecf3;
      font-family: 'Noto Sans HK', 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .mtr-screen {
      margin-top: 40px;
      background: #e6ecf3;
      border-radius: 18px;
      box-shadow: 0 6px 28px #0002;
      padding: 0;
      min-width: 350px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;
    }
    .header-bar {
      background: #597ab9;
      color: #fff;
      font-size: 1.7em;
      font-weight: bold;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      height: 54px;
      padding: 0 24px 0 0;
      letter-spacing: 0.03em;
    }
    .arrivals-table {
      width: 100%;
      border-collapse: collapse;
    }
    .arrivals-table tr {
      height: 54px;
      font-size: 1.35em;
      font-weight: 600;
    }
    .arrivals-table tr:nth-child(odd) {
      background: #f4f7fa;
    }
    .arrivals-table tr:nth-child(even) {
      background: #dbe5f2;
    }
    .arrivals-table td {
      padding: 0 26px;
      vertical-align: middle;
      border: none;
    }
    .bus-name {
      color: #384e6c;
      font-size: 1.15em;
      font-weight: bold;
      text-align: left;
      letter-spacing: 0.04em;
    }
    .wait-mins {
      color: #384e6c;
      font-size: 1.35em;
      font-weight: bold;
      text-align: right;
      letter-spacing: 0.04em;
      min-width: 80px;
    }
    .wait-mins .unit {
      font-size: 0.9em;
      color: #888;
      margin-left: 6px;
      font-weight: normal;
    }
    @media (max-width: 500px) {
      .mtr-screen {
        min-width: 0;
        max-width: 98vw;
      }
      .header-bar {
        font-size: 1.08em;
        height: 38px;
        padding-right: 8px;
      }
      .arrivals-table td {
        padding: 0 8px;
      }
      .arrivals-table tr {
        font-size: 1em;
        height: 38px;
      }
      .wait-mins {
        min-width: 56px;
        font-size: 1em;
      }
      .bus-name {
        font-size: 1em;
      }
    }
  </style>
</head>

    // Helper: get Date objects for a bus timetable for given day offset
    function getBusDateTimesForDay(busTimes, dayOffset = 0) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      return busTimes.map(t =>
        new Date(date.getFullYear(), date.getMonth(), date.getDate(), t.hour, t.minute, 0, 0)
      );
    }

    // Helper: get next n buses from a given timetable
    function getNextNBuses(busTimes, n) {
      const now = new Date();
      let buses = [];
      let todayBuses = getBusDateTimesForDay(busTimes, 0).filter(busTime => busTime > now);
      if (todayBuses.length >= n) {
        buses = todayBuses.slice(0, n);
      } else {
        buses = todayBuses;
        let tomorrowBuses = getBusDateTimesForDay(busTimes, 1);
        let needed = n - buses.length;
        buses = buses.concat(tomorrowBuses.slice(0, needed));
      }
      return buses;
    }

    // Helper: format waiting time in minutes and seconds
    function formatWait(diffMs) {
      const diffSec = Math.floor(diffMs / 1000);
      const minutes = Math.floor(diffSec / 60);
      const seconds = diffSec % 60;
      return `${minutes}.${seconds.toString().padStart(2,'0')}`;
    }

    // Helper: format current time as HH:mm (24h)
    function formatCurrentTime(dateObj) {
      return dateObj.getHours().toString().padStart(2, '0') + ':' +
             dateObj.getMinutes().toString().padStart(2, '0') + ':' + 
             dateObj.getSeconds().toString().padStart(2, '0');
    }

    // Combine both bus lines, sorted by soonest arrival
    function getNextCombinedArrivals(n) {
      const now = new Date();
      // Get all upcoming arrivals for A and B (today + tomorrow)
      const arrivalsA = getNextNBuses(busATimes, n*2).map(dt => ({ bus: 'Bus A', time: dt }));
      const arrivalsB = getNextNBuses(busBTimes, n*2).map(dt => ({ bus: 'Bus B', time: dt }));
      const allArrivals = arrivalsA.concat(arrivalsB)
        .filter(obj => obj.time > now)
        .sort((a, b) => a.time - b.time);
      return allArrivals.slice(0, n);
    }

    function updateArrivalsTable() {
      const table = document.getElementById('arrivals-table');
      const now = new Date();
      const nextArrivals = getNextCombinedArrivals(4);

      let html = '';
      nextArrivals.forEach(arrival => {
        const diffMs = arrival.time - now;
        html += `
          <tr>
            <td class="bus-name">${arrival.bus}</td>
            <td class="wait-mins">${formatWait(diffMs)}</td>
          </tr>
        `;
      });
      table.innerHTML = html;
    }

    function updateCurrentTime() {
      const now = new Date();
      document.getElementById('current-time').textContent = formatCurrentTime(now);
    }

    function updateAll() {
      updateCurrentTime();
      updateArrivalsTable();
    }

    setInterval(updateAll, 1000);
    updateAll();
