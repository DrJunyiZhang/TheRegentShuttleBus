      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .mtr-screen {

      background: #e6ecf3;

      text-align: left;

      text-align: right;
      letter-spacing: 0.04em;

      }

    // ── Helper: Choose correct timetable based on day ────────────
    function getTimetable(bus) {
      const now = new Date();
      const isWeekend = now.getDay() === 0 || now.getDay() === 6; // 0=Sun, 6=Sat

      if (bus === 'A') return isWeekend ? busATimesWeekend : busATimesWeekday;
      if (bus === 'B') return isWeekend ? busBTimesWeekend : busBTimesWeekday;
      if (bus === 'C') return isWeekend ? busCTimesWeekend : busCTimesWeekday;
      return [];
    }

    // ── Helpers ──────────────────────────────────────────────────
    function getBusDateTimesForDay(busTimes, dayOffset = 0) {
      const now = new Date();
      const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
      return busTimes.map(t => 
        new Date(date.getFullYear(), date.getMonth(), date.getDate(), t.hour, t.minute, 0, 0)
      );
    }

    function getNextNBuses(bus, n) {
      const now = new Date();
      const times = getTimetable(bus);

      let buses = [];
      let todayBuses = getBusDateTimesForDay(times, 0).filter(t => t > now);
      
      if (todayBuses.length >= n) {
        buses = todayBuses.slice(0, n);
      } else {
        buses = todayBuses;
        const tomorrowBuses = getBusDateTimesForDay(times, 1);
        const needed = n - buses.length;
        buses = buses.concat(tomorrowBuses.slice(0, needed));
      }
      return buses;
    }

    function formatWait(diffMs) {
      const diffSec = Math.floor(diffMs / 1000);
      const minutes = Math.floor(diffSec / 60);
      const seconds = diffSec % 60;
      return `${minutes}.${seconds.toString().padStart(2,'0')}`;
    }

    function formatCurrentTime(dateObj) {
      return dateObj.getHours().toString().padStart(2, '0') + ':' +
             dateObj.getMinutes().toString().padStart(2, '0') + ':' + 
             dateObj.getSeconds().toString().padStart(2, '0');
    }

    function formatCurrentDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
      const day = dateObj.getDate().toString().padStart(2, '0');
      const weekday = dateObj.toLocaleString('en-US', { weekday: 'long' });
      return `${year}-${month}-${day} ${weekday}`;
    }

    function getNextCombinedArrivals(n) {
      const now = new Date();
      const arrivalsA = getNextNBuses('A', n*2).map(dt => ({ bus: 'Bus A', time: dt }));
      const arrivalsB = getNextNBuses('B', n*2).map(dt => ({ bus: 'Bus B', time: dt }));
      const arrivalsC = getNextNBuses('C', n*2).map(dt => ({ bus: 'Bus C', time: dt }));
      
      const allArrivals = arrivalsA.concat(arrivalsB, arrivalsC)
        .filter(obj => obj.time > now)
        .sort((a, b) => a.time - b.time);
      
      return allArrivals.slice(0, n);
    }

    }

      nextArrivals.forEach(arrival => {
        const diffMs = arrival.time - now;

            <td class="wait-mins">${formatWait(diffMs)}</td>
          </tr>
        `;
      });
